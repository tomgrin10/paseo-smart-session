name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry (for example v1.2.3)
        required: true
        type: string
      allow_latest:
        description: Publish a stable version to npm's latest tag. Prereleases always go to beta.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Require the tagged commit to be on main
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.20.0
      - name: Require the tag to match package.json
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
      # Every release carries real notes (release-notes.mjs): a beta's changes/ fragments, an rc's or
      # stable's curated CHANGELOG.md section. Empty or boilerplate notes stop here, before npm.
      - name: Require release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node release-notes.mjs body "$RELEASE_TAG" > /dev/null
      # Betas only by default: a prerelease goes to `beta`; a stable version refuses unless
      # someone ran this by hand with allow_latest=true (release-tag.mjs).
      - name: Choose the npm dist-tag
        id: dist
        env:
          ALLOW_LATEST: ${{ inputs.allow_latest == true && 'true' || 'false' }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$ALLOW_LATEST" = "true" ]; then tag="$(node release-tag.mjs "$package_version" --allow-latest)"; else tag="$(node release-tag.mjs "$package_version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $package_version to the npm dist-tag: $tag"
      - name: Verify npm trusted publishing authorization
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const { name } = JSON.parse(readFileSync("package.json", "utf8"));
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set("audience", "npm:registry.npmjs.org");
          const identity = await fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }, signal: AbortSignal.timeout(30000) });
          if (!identity.ok) throw new Error(`GitHub OIDC request failed (${identity.status}).`);
          const { value: idToken } = await identity.json();
          console.log(`::add-mask::${idToken}`);
          const claims = JSON.parse(Buffer.from(idToken.split(".")[1], "base64url"));
          console.log(JSON.stringify({ package: name, repository: claims.repository, workflow: claims.workflow_ref, subject: claims.sub, environment: claims.environment, event: claims.event_name }));
          const response = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(name)}`, { method: "POST", headers: { Authorization: `Bearer ${idToken}` }, signal: AbortSignal.timeout(30000) });
          const body = await response.json();
          if (!response.ok) {
            console.error(`::error::npm rejected trusted publishing for ${name} (${response.status}): ${body.message || "authorization denied"}. Check publisher expiry, repository identity, workflow filename, environment, and allowed actions in npm Settings.`);
            process.exit(1);
          }
          if (!body.token) throw new Error("npm exchange returned no publication token.");
          console.log(`::add-mask::${body.token}`);
          console.log(`npm trusted publishing authorization verified for ${name}.`);
          JS
      - run: npm ci
      - run: npm run verify
      - run: npm pack --dry-run
      - name: Publish or verify the existing package
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const spec = `${pkg.name}@${pkg.version}`;
          const distTag = process.env.DIST_TAG;
          if (distTag !== "beta" && distTag !== "latest") { console.error(`::error::No dist-tag chosen (${distTag}).`); process.exit(1); }
          const run = args => spawnSync("npm", args, { encoding: "utf8" });
          const packed = run(["pack", "--dry-run", "--json"]);
          if (packed.status !== 0) { process.stderr.write(packed.stderr); process.exit(1); }
          const integrity = JSON.parse(packed.stdout)[0].integrity;
          const existing = run(["view", spec, "dist.integrity", "--json", "--prefer-online", "--registry", "https://registry.npmjs.org"]);
          if (existing.status === 0) {
            if (JSON.parse(existing.stdout) !== integrity) {
              console.error(`::error::${spec} already exists with different contents. Release a new version; do not rewrite the tag.`);
              process.exit(1);
            }
            console.log(`${spec} is already published with matching contents; continuing the release.`);
          } else {
            let error;
            try { error = JSON.parse(existing.stdout).error; } catch {}
            if (error?.code !== "E404") { process.stderr.write(existing.stderr); process.exit(1); }
            const result = spawnSync("npm", ["publish", "--access", "public", "--tag", distTag, "--registry", "https://registry.npmjs.org"], { stdio: "inherit" });
            if (result.status !== 0) {
              console.error("::error::npm publication failed. Check this package's GitHub trusted publisher repository, workflow filename, permissions, and environment in npm Settings.");
              process.exit(result.status || 1);
            }
            let verified = false;
            for (let attempt = 0; attempt < 60; attempt++) {
              const remote = run(["view", spec, "dist.integrity", "--json", "--prefer-online", "--registry", "https://registry.npmjs.org"]);
              if (remote.status === 0 && JSON.parse(remote.stdout) === integrity) { verified = true; break; }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!verified) { console.error(`::error::Registry verification failed for ${spec}.`); process.exit(1); }
          }
          // The release must sit on its tag, and a beta must never have moved latest.
          let tags = null;
          for (let attempt = 0; attempt < 24; attempt++) {
            const view = run(["view", pkg.name, "dist-tags", "--json", "--prefer-online", "--registry", "https://registry.npmjs.org"]);
            if (view.status === 0) { tags = JSON.parse(view.stdout); if (tags[distTag] === pkg.version) break; }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.log(`dist-tags: ${JSON.stringify(tags)}`);
          if (tags?.[distTag] !== pkg.version) { console.error(`::error::${spec} is not on the ${distTag} dist-tag.`); process.exit(1); }
          if (distTag === "beta" && tags.latest === pkg.version) { console.error(`::error::${spec} is a beta but npm's latest points at it.`); process.exit(1); }
          JS

  # The GitHub release, once npm has the package: one layout for every release (release-notes.mjs).
  # A release someone already created by hand gets the same body, so none drifts from the format.
  release:
    name: Publish the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Create or update the release with its notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node release-notes.mjs body "$RELEASE_TAG" > "$notes"
          title="$(node release-notes.mjs title "$RELEASE_TAG")"
          # A prerelease (beta or rc) is a GitHub prerelease and never "Latest".
          case "$RELEASE_TAG" in
            *-*) channel=(--prerelease --latest=false) ;;
            *) channel=(--latest) ;;
          esac
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$notes" "${channel[@]}"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file "$notes" "${channel[@]}"
          fi
          gh release view "$RELEASE_TAG" --json body --jq .body | grep -q "^## What's new" || { echo "::error::The release body is missing its notes."; exit 1; }
